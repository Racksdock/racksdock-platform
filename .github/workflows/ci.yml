name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: racksdock-platform }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/racksdock-subnet", path: racksdock-subnet }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/racksdock-node", path: racksdock-node }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e racksdock-subnet -e racksdock-node -e "racksdock-platform[test,dev]"
      - run: cd racksdock-platform && ruff check src tests && pytest
