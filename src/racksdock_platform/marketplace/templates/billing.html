{% extends "base.html" %}{% block title %}Billing · RacksDock{% endblock %}
{% block content %}
<h1>Billing</h1>
<section class="card"><p>Credits: $<span id="credits"></span></p><label>Add credits (dev stub) $ <input id="amt" type="number" value="100"></label> <button onclick="buy()">Add</button></section>
<table id="events"><thead><tr><th>When</th><th>Kind</th><th>Amount</th><th>Instance</th><th>Note</th></tr></thead><tbody></tbody></table>
{% endblock %}
{% block scripts %}<script>
async function load(){ const a = await api('/v1/account'); document.getElementById('credits').textContent=(a.credits_cents/100).toFixed(2); const u = await api('/v1/billing/usage'); const tb=document.querySelector('#events tbody'); tb.innerHTML=''; for (const e of u.events){ tb.insertAdjacentHTML('beforeend', `<tr><td>${e.at}</td><td>${e.kind}</td><td>$${(e.cents/100).toFixed(2)}</td><td>${e.instance_id||''}</td><td>${esc(e.note)}</td></tr>`);} }
async function buy(){ await api('/v1/billing/credits/purchase', {cents: Math.round(+document.getElementById('amt').value*100)}); load(); }
load();
</script>{% endblock %}
