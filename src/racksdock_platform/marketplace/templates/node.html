{% extends "base.html" %}{% block title %}Node verification · RacksDock{% endblock %}
{% block content %}
<h1>Node verification</h1>
<p><code>{{ node_id }}</code></p>
<div id="v" class="grid"></div>
{% endblock %}
{% block scripts %}<script>
async function render(){ const d = await api('/v1/nodes/{{ node_id }}/verification'); const q = d.qualification||{}; const sm=q.spec_measured||{};
 document.getElementById('v').innerHTML = `
 <section class="card"><h2>Status</h2><p>${d.status}${d.host_connected===false?` · <strong class="bad">host offline since ${d.offline_since||'?'}</strong>`:''} · ${esc(d.instance_type||'')} · ${({vm:'VM (dedicated kernel)', container:'Docker (shared kernel)', static:'static (lab)', dual:'VM or Docker (customer picks at launch)'})[d.deployment]||esc(d.deployment||'')} · perf ${d.perf} · provider ${esc(d.provider)} · ${esc(d.region)}${d.operator_owned?' · <span class="badge">operator-owned</span>':''}${d.critical_fault?`<p class="error">critical fault: ${esc(d.critical_fault)}</p>`:''}</p><p>Funded slot: ${d.funded_slot} · active strike weight: ${d.active_strike_weight}</p></section>
 ${(d.outages||[]).length?`<section class="card"><h2>Host outages (7 days)</h2><ul class="small">${d.outages.map(o=>`<li>${o.started_at} → ${o.ended_at||'<strong>ongoing</strong>'}${o.rented?' · a tenant was renting':''}${o.reason?` · ${esc(o.reason)}`:''}</li>`).join('')}</ul></section>`:''}
 <section class="card"><h2>Verification progress</h2>${(()=>{ const p=d.progress; if(!p) return '<p>no verification session yet</p>';
   const MARK={pass:'✓',fail:'✗',running:'⏳',pending:'·',skipped:'–'}; const head = p.outcome ? `${p.session_kind} · <strong>${p.outcome}</strong> · finished ${p.updated_at}` : (p.done >= p.total ? `${p.session_kind} · all ${p.total} steps done · waiting for the validator's outcome` : `${p.session_kind} · running · step ${p.done+1} of ${p.total}${p.current_name?` · ${esc(p.current_name)}`:''}`);
   const pct = p.total ? Math.round(100*p.done/p.total) : 0;
   return `<p>${head}</p><div class="bar"><div class="fill ${p.outcome==='pass'?'ok':p.failed.length?'bad':''}" style="width:${pct}%"></div></div><table class="small"><tbody>${p.steps.map(s=>`<tr class="step ${s.state}"><td>${MARK[s.state]||'·'}</td><td>${s.id}</td><td>${esc(s.name||'')}</td><td>${s.state}${s.duration_s?` · ${Math.round(s.duration_s)}s`:''}</td><td class="muted">${esc(s.detail||'')}</td></tr>`).join('')}</tbody></table>`; })()}</section>
 <section class="card"><h2>Registration</h2><p>Registered at block ${d.registration.registered_block}, hash <code class="small">${d.registration.registration_hash}</code></p><p>GPU identities (from NVIDIA device certificates):</p><ul class="small">${(d.registration.gpu_ids||[]).map(g=>`<li><code>${g}</code></li>`).join('')}</ul></section>
 <section class="card"><h2>Latest qualification</h2>${q.outcome?`<p>${q.kind} · ${q.outcome} · ${q.finished_at} · reference ${esc(q.reference_set||'')} · image ${esc(q.verify_image||'')}</p><pre class="small">${esc(JSON.stringify(sm,null,1))}</pre>`:'<p>none yet</p>'}</section>
 <section class="card"><h2>Canaries</h2><p>${d.canaries.passed}/${d.canaries.total} passed${d.canaries.pass_rate!=null?` (${(d.canaries.pass_rate*100).toFixed(1)}%)`:''}</p></section>
 <section class="card"><h2>Strikes</h2>${d.strikes.length?`<ul>${d.strikes.map(s=>`<li>${s.at} · ${esc(s.reason)} (${s.weight})</li>`).join('')}</ul>`:'<p>none</p>'}</section>
 <section class="card"><h2>History</h2><ul class="small">${d.qualification_history.map(h=>`<li>${h.finished_at} · ${h.kind} · ${h.outcome} · perf ${h.perf??'-'} · <a href="/v1/evidence/${h.hash}">evidence</a></li>`).join('')}</ul><p><a href="${d.evidence_url}">all evidence</a></p></section>`; return d; }
render(); setInterval(render, 5000);  // the progress card updates live while a validator session runs
</script>{% endblock %}
